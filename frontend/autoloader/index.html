<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preload" href="ps5-hero.jpg" as="image" />
  <title>PS5-WebKit-Autoloader</title>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>

  <div id="splash" aria-hidden="false"></div>

  <iframe id="exploit" title="exploit" hidden></iframe>

  <main id="loader" hidden>
    <img id="appLogo" src="logo.svg" alt="" width="72" height="72" />
    <p id="titleMsg">PS5-WebKit-Autoloader <span id="appVer">v[[VERSION_PLACEHOLDER]]</span></p>
    <p id="metaMsg">FW — · chain —</p>
    <p id="statusMsg">Jailbreak started</p>
    <div id="progressContainer">
      <div id="progressBar"></div>
    </div>
    <div id="progressPct">0%</div>
    <p id="elapsedMsg">Elapsed 0:00</p>
    <div id="successMsg"><span class="check">✓</span> Jailbreak completed successfully</div>
    <div id="failMsg">Jailbreak failed - restart your console</div>
    <div id="progressLabel" hidden>Jailbreak in progress</div>
    <div id="logWrapper" hidden>
      <div id="logContainer"></div>
    </div>
    <div id="p2jbStats" hidden>
      <div class="stats-head">
        <span class="stats-title">P2JB</span>
        <span class="stats-chip" id="p2jbStepChip">STEP &ndash;/7</span>
        <span class="stats-clock" id="p2jbClocks">total --:--:--</span>
      </div>
      <div class="stats-status" id="p2jbStatus">&#8230;</div>
      <div class="stats-infoline">
        <div class="stats-detail" id="p2jbDetail" hidden></div>
        <div id="p2jbGroups" hidden></div>
      </div>
      <div class="stats-bar-row">
        <div class="stats-bar-label"><span id="p2jbPhaseName">PHASE</span><span id="p2jbPhasePct">&ndash;</span></div>
        <div class="stats-track"><div class="stats-fill" id="p2jbPhaseFill"></div></div>
        <div class="stats-meta" id="p2jbPhaseMeta">ETA --:--:--</div>
      </div>
      <div class="stats-bar-row overall">
        <div class="stats-bar-label"><span>OVERALL</span><span id="p2jbOverallPct">&ndash;</span></div>
        <div class="stats-track big"><div class="stats-fill" id="p2jbOverallFill"></div></div>
        <div class="stats-meta" id="p2jbOverallMeta">&ndash; left</div>
      </div>
    </div>
  </main>

  <footer id="footer"><b>Created by X-F1REBALL-X</b></footer>
  <script src="app.js"></script>
</body>
</html>
